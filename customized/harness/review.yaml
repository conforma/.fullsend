# forward the upstream read-only guarantee explicitly.
readonly_repo: true

env:
    runner:
        REVIEW_FINDING_SEVERITY_THRESHOLD: "high"
    sandbox:
        REVIEW_FINDING_SEVERITY_THRESHOLD: "high"
